name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Expo bundler plugins
        run: |
          npm install
          npm install --save-dev babel-preset-expo @expo/metro-config

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      - name: Enable Offline JS Bundling in Debug Build
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let content = fs.readFileSync(path, 'utf8');
          if (content.includes('react {')) {
            content = content.replace('react {', 'react {\n    bundleInDebug = true');
          } else if (content.includes('project.ext.react = [')) {
            content = content.replace('project.ext.react = [', 'project.ext.react = [\n    bundleInDebug: true,');
          } else {
            content += '\nproject.ext.react = [ bundleInDebug: true ]\n';
          }
          fs.writeFileSync(path, content);
          "

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Standalone Offline APK
        run: |
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnl-tracker-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
