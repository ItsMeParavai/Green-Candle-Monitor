name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Ensure index.js entrypoint exists
        run: |
          node -e "
          const fs = require('fs');
          fs.writeFileSync('index.js', \"import { registerRootComponent } from 'expo';\nimport App from './App';\nregisterRootComponent(App);\n\");
          "

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure Debug Signing & Offline Bundle
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let content = fs.readFileSync(path, 'utf8');
          content = content.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }');
          fs.writeFileSync(path, content);
          "

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Standalone Offline APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnl-tracker-offline-apk
          path: android/app/build/outputs/apk/release/*.apk
